    <path d="M25 80 L35 25 C37 15 48 10 58 12 L70 15 C75 16 85 16 90 15 L102 12 C112 10 123 15 125 25 L135 80 C138 95 122 105 110 95 L95 82 C90 78 82 78 77 82 L62 95 C50 105 34 95 37 80 Z" fill="#201045" fill-opacity="0.6"/>
