  <text x="200" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">GAMES TRAFICS</text>
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Aperçu indisponible</text>
